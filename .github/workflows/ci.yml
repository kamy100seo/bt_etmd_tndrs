name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 bt-etmd-tndrs.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 bt-etmd-tndrs.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test script compilation
      run: python -m py_compile bt-etmd-tndrs.py

    - name: Test data fetching (dry run)
      run: |
        python -c "
        import os
        from importlib.machinery import SourceFileLoader
        os.environ['TARGET_URL'] = 'https://example.com'
        path = 'bt-etmd-tndrs.py'
        loader = SourceFileLoader('bt_etmd_tndrs_module', path)
        mod = loader.load_module()
        print('Module loaded successfully')
        "

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build and test PDF generation
      run: |
        python -c "
        import os
        from importlib.machinery import SourceFileLoader
        os.environ['TARGET_URL'] = 'https://example.com'
        path = 'bt-etmd-tndrs.py'
        loader = SourceFileLoader('bt_etmd_tndrs_module', path)
        mod = loader.load_module()
        # Test with empty data
        mod.build_pdf([], 'test_output.pdf')
        print('PDF generation test passed')
        "